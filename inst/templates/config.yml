# phostor configuration.
#
# The directory holding this file is the work directory: everything phostor
# writes for this collection goes there. For a second collection, make a second
# directory with its own config.yml.
#
# Edit this file with any text editor. phostor does not write back to it.

# ---------------------------------------------------------------------------
# The only path you must set.
# ---------------------------------------------------------------------------

# The directory of photographs. phostor treats it as read-only and never writes
# to it. It must not contain, be contained by, or be the same as the directory
# this file is in; phostor will not start otherwise.
photo_root: ~/photos

# Shown in the browser title bar, and recorded in each session.yml.
title: Photographs

# ---------------------------------------------------------------------------
# Display. Both are pre-rendered for every photo before the app starts.
# ---------------------------------------------------------------------------

# Longest edge of the display copy, in pixels. 4096 suits a 4K display; lower
# it to 2048 for a smaller screen, or if rendering takes too long.
display_size: 4096

# Longest edge of the thumbnail shown in the folder tree.
thumb_size: 256

# ---------------------------------------------------------------------------
# Recording.
# ---------------------------------------------------------------------------

# A visit shorter than this many seconds is logged in path.tsv but writes no
# sidecar and no audio, so paging through photos does not leave a record for
# each one. Set it to 0 to keep every visit.
min_visit_seconds: 2

# Seconds of audio per uploaded chunk. Each chunk is written to disk as it
# arrives, so this is also how much a crash can lose. Smaller values mean more
# round trips.
chunk_seconds: 5

# Transcribe each recording once you move on to the next photograph. The
# transcript is written beside the audio as visit-NNNN.txt. Transcription runs
# entirely on this Mac -- nothing is uploaded -- and needs macOS 26 or newer
# and Xcode's command line tools. Without those, recording is unaffected and
# no transcript is written.
transcribe: true

# Language to transcribe in, as a BCP-47 tag: en-US, en-GB, de-DE. Leave empty
# to use whatever this Mac is set to. `phostor preflight` lists the languages
# installed.
transcribe_locale: 

# ---------------------------------------------------------------------------
# Which files count as photographs.
# ---------------------------------------------------------------------------

# Extensions to index, lowercased and without the dot. Matching is
# case-insensitive, so `jpg` covers `.JPG`.
extensions:
  - jpg
  - jpeg
  - jpe
  - png
  - gif
  - bmp
  - tif
  - tiff
  - webp
  - heic
  - heif
  - avif

# Directory and file names never to index, at any depth.
cruft:
  - "@eaDir"
  - "#recycle"
  - "#snapshot"
  - "@tmp"
  - ".@__thumb"
  - "@sharebin"
  - .DS_Store
  - Thumbs.db
  - .Spotlight-V100
  - .TemporaryItems
  - .Trashes
  - .fseventsd
